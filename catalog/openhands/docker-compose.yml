services:
  openhands:
    build: ../_autologin
    ports: ["127.0.0.1:7806:80"]
    environment:
      UPSTREAM: openhands_app:8000
      APP_PORT: "7806"
      AUTH_HEADER: ""
      # The same seeding the app does with AGENT_CANVAS_ALLOW_LAN_SESSION_KEY, but only on the owner's port,
      # so containers on mos-net cannot read the key from the page. The health record is cleared because failures
      # saved while the app was stopped would otherwise bring up the "Check your backend" screen.
      HEAD_SNIPPET: '<script>window.__AGENT_CANVAS_SESSION_API_KEY__="${LOCAL_BACKEND_API_KEY}";try{var k="openhands-agent-server-config",c=JSON.parse(localStorage.getItem(k)||"{}");c.sessionApiKey="${LOCAL_BACKEND_API_KEY}";localStorage.setItem(k,JSON.stringify(c));localStorage.removeItem("openhands-backend-health")}catch(e){}</script>'
    depends_on: [openhands_app]
    networks: [default, mos-net]
    restart: unless-stopped

  openhands_app:
    image: ghcr.io/openhands/agent-canvas:1.34.0
    environment:
      LOCAL_BACKEND_API_KEY: "${LOCAL_BACKEND_API_KEY}"
    volumes:
      - openhands-state:/home/openhands/.openhands
      - openhands-projects:/projects
    restart: unless-stopped
volumes:
  openhands-state: {}
  openhands-projects: {}
networks:
  mos-net:
    external: true
